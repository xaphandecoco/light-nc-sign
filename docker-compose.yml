# Reference compose file for Light NC Sign (builds from this repository).
# The Light NC production bundle lives in the LNC-IS repository (deploy/sign).
name: lnc-sign
services:
  mongo:
    image: mongo:7.0.45
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
  server:
    build:
      context: .
      dockerfile: apps/OpenSignServer/Dockerhubfile
    env_file: .env.prod
    environment:
      - NODE_ENV=production
      - APP_ID=lnc-sign
      - PORT=8080
      - USE_LOCAL=true
      - MONGODB_URI=mongodb://mongo:27017/lncsign
    volumes:
      - sign-files:/usr/src/app/files
    depends_on:
      - mongo
    restart: unless-stopped
  client:
    build:
      context: .
      dockerfile: apps/OpenSign/Dockerhubfile
    env_file: .env.prod
    depends_on:
      - server
    restart: unless-stopped
  proxy:
    image: caddy:2.10.2-alpine
    ports:
      - "8390:8390"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - client
      - server
    restart: unless-stopped
volumes:
  mongo-data:
  sign-files:
